<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VOXA — Order Display</title>
<style>
:root{
--bg:#050711;--ink:#f7f8fb;--muted:#9aa2ad;--gold:#d9b15f;--green:#48e6a3;
--line:rgba(255,255,255,.25);--panel:rgba(8,12,20,.66);
}
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink);background:var(--bg)}
#app{position:fixed;inset:0;overflow:hidden;background:#050711}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.grid-noise{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:.025;
background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:46px 46px}
.vignette{position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(circle at 50% 35%,transparent 15%,rgba(0,0,0,.2) 55%,rgba(0,0,0,.78) 100%)}
.shell{position:absolute;z-index:5;inset:0;padding:3.7vh 5vw 2.3vh;display:grid;grid-template-rows:auto 1fr auto;gap:1.55vh}
header{display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:flex;align-items:center;gap:13px}
.logo{width:58px;height:58px;border-radius:18px;overflow:hidden;display:block;object-fit:cover;background:#000;border:1px solid rgba(255,255,255,.18);box-shadow:0 14px 36px rgba(0,0,0,.45)}
.kicker{font-size:9px;letter-spacing:2.5px;color:var(--gold);font-weight:900}
h1{font-size:30px;line-height:1;margin:5px 0 0;font-weight:1000}.sub{font-size:9px;color:var(--muted);margin-top:5px}
.clock{text-align:left;direction:ltr}.time{font-size:28px;font-weight:950}.date{font-size:8px;color:var(--muted);margin-top:3px}
.main{min-height:0;display:flex;flex-direction:column;gap:1.45vh}
.panel{min-height:0;flex:1;border:1px solid var(--line);border-radius:24px;padding:15px;background:linear-gradient(145deg,rgba(18,24,36,.74),rgba(3,7,13,.60));box-shadow:0 24px 70px rgba(0,0,0,.48),inset 0 1px rgba(255,255,255,.03);overflow:hidden;position:relative}
.panel.ready{flex:1.05}
.panel:before{content:"";position:absolute;inset:-45%;background:radial-gradient(circle at 40% 35%,rgba(37,79,255,.11),transparent 33%);animation:orbFloat 12s ease-in-out infinite alternate}
.panel.ready:before{background:radial-gradient(circle at 60% 35%,rgba(61,229,163,.10),transparent 33%)}
@keyframes orbFloat{from{transform:translate(-3%,-2%) scale(1)}to{transform:translate(5%,4%) scale(1.08)}}
.head{height:36px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
.title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:950}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 18px var(--gold)}
.ready .dot{background:var(--green);box-shadow:0 0 18px var(--green)}
.count{font-size:8px;color:#b8c0c8;background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:5px 9px}
.grid{height:calc(100% - 36px);position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:8px}
.order{position:relative;overflow:hidden;display:grid;place-items:center;border-radius:14px;background:linear-gradient(145deg,rgba(62,44,19,.94),rgba(13,11,8,.96));border:1px solid rgba(217,177,95,.42);color:#ffe4ae;font-size:21px;font-weight:950;box-shadow:0 10px 24px rgba(0,0,0,.34);animation:orderIn .65s cubic-bezier(.16,1,.3,1) both}
.ready .order{background:linear-gradient(145deg,rgba(11,50,35,.95),rgba(6,18,13,.96));border-color:rgba(72,230,163,.44);color:#a8f4cf}
.order:before{content:"";position:absolute;inset:-90% -45%;background:linear-gradient(110deg,transparent 43%,rgba(255,255,255,.12) 50%,transparent 57%);transform:translateX(-60%);animation:shine 5.2s ease-in-out infinite}
.order:after{content:"";position:absolute;left:16%;right:16%;bottom:0;height:2px;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.ready .order:after{background:var(--green);box-shadow:0 0 12px var(--green)}
@keyframes orderIn{from{opacity:0;transform:translateY(12px) scale(.86)}to{opacity:1;transform:none}}
@keyframes shine{0%,56%{transform:translateX(-65%)}78%,100%{transform:translateX(65%)}}
.ad{position:relative;height:11.2vh;min-height:78px;border:1px solid var(--line);border-radius:21px;overflow:hidden;background:#0c1118;box-shadow:0 18px 52px rgba(0,0,0,.48)}
.ad-slide{position:absolute;inset:0;display:grid;grid-template-columns:1.38fr .62fr;align-items:center;padding:0 17px;gap:14px;opacity:0;transform:scale(1.02);transition:opacity .65s ease,transform 1.1s ease}
.ad-slide.active{opacity:1;transform:none}
.ad-photo{width:100%;height:82px;max-height:88%;object-fit:cover;border-radius:14px;filter:saturate(1.12) contrast(1.08);box-shadow:0 12px 30px rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.12);background:#111}
.ad-copy .eyebrow{font-size:8px;color:var(--gold);font-weight:900;letter-spacing:1.7px}
.ad-copy strong{display:block;font-size:18px;line-height:1.03;margin:4px 0;font-weight:1000}
.ad-copy small{display:block;font-size:8px;color:#c1c8cf;line-height:1.45}
.offer{display:inline-flex;margin-top:6px;padding:4px 8px;border-radius:999px;background:rgba(217,177,95,.13);border:1px solid rgba(217,177,95,.3);color:#f0cb80;font-size:8px;font-weight:900}
.ad-dots{position:absolute;left:10px;top:8px;display:flex;gap:4px}
.ad-dots i{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.28)}
.ad-dots i.active{background:#fff;box-shadow:0 0 8px #fff}
.progress{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.06)}
.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#d9b15f,#fff,#48e6a3)}
footer{display:flex;justify-content:space-between;color:#69717a;font-size:7px;padding-top:7px}footer b{color:#c6cdd2}
#toast{position:absolute;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%) scale(.86);opacity:0;background:rgba(5,14,10,.96);border:1px solid rgba(72,230,163,.65);border-radius:22px;padding:21px 27px;text-align:center;box-shadow:0 30px 100px rgba(0,0,0,.72);transition:.35s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}#toast .num{font-size:43px;font-weight:1000;color:var(--green)}#toast small{display:block;margin-top:4px;font-size:10px;color:#c4cbc9}
.controls{position:absolute;z-index:40;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:6px;opacity:0;transition:.2s}#app:hover .controls{opacity:1}
button{border:1px solid rgba(255,255,255,.28);background:rgba(3,6,10,.9);color:#eef1f3;border-radius:10px;padding:7px 10px;font-size:9px;cursor:pointer}.kiosk .controls{display:none}
</style></head>
